<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Body Metrics</title>

<style>
:root {
  --bg: #000;
  --fg: #fff;
  --muted: #aaa;
  --accent: #fff;
}

* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
}

header {
  padding: 16px;
  text-align: center;
  font-size: 20px;
  border-bottom: 1px solid #222;
}

section {
  display: none;
  padding: 20px;
}

section.active { display: block; }

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  background: #111;
  color: #fff;
  border: 1px solid #333;
  border-radius: 6px;
}

button {
  background: #fff;
  color: #000;
  font-weight: 600;
}

.stat {
  font-size: 28px;
  margin: 10px 0;
}

.sub { color: var(--muted); font-size: 14px; }

nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #000;
  border-top: 1px solid #222;
}

nav button {
  flex: 1;
  border: none;
  background: none;
  color: #aaa;
  padding: 12px;
}

nav button.active { color: #fff; }

canvas { background:#000; margin-top:20px; }
</style>
</head>

<body>

<header>Body Metrics</header>

<section id="dashboard" class="active">
  <div class="stat" id="targetCalories">—</div>
  <div class="sub">Target calories today</div>

  <div class="stat" id="status">—</div>
  <div class="sub">Daily status</div>

  <div class="stat" id="trend">—</div>
  <div class="sub">Weight trend</div>
</section>

<section id="log">
  <input id="logWeight" type="number" placeholder="Today's weight (kg)" />
  <input id="logCalories" type="number" placeholder="Calories eaten today" />
  <button onclick="logDay()">Save Log</button>
</section>

<section id="progress">
  <canvas id="chart" height="200"></canvas>
</section>

<section id="goal">
  <input id="targetWeight" type="number" placeholder="Target weight (kg)" />
  <button onclick="saveTarget()">Save Goal</button>
  <div class="stat" id="eta">—</div>
  <div class="sub">Estimated time to goal</div>
</section>

<section id="insights">
  <div id="insightText">Log data to receive insights.</div>
</section>

<section id="settings">
  <input id="age" type="number" placeholder="Age" />
  <input id="height" type="number" placeholder="Height (cm)" />
  <select id="gender">
    <option value="">Gender</option>
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>
  <select id="activity">
    <option value="1.2">Sedentary</option>
    <option value="1.375">Light</option>
    <option value="1.55">Moderate</option>
    <option value="1.725">Very Active</option>
  </select>
  <button onclick="saveSettings()">Save Settings</button>
</section>

<nav>
  <button onclick="show('dashboard')" class="active">Home</button>
  <button onclick="show('log')">Log</button>
  <button onclick="show('progress')">Progress</button>
  <button onclick="show('goal')">Goal</button>
  <button onclick="show('insights')">Insights</button>
  <button onclick="show('settings')">Settings</button>
</nav>

<script>
const data = JSON.parse(localStorage.getItem("data") || "{}");
data.logs ||= [];

function show(id){
  document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  update();
}

function saveSettings(){
  data.age = +age.value;
  data.height = +height.value;
  data.gender = gender.value;
  data.activity = +activity.value;
  save();
}

function saveTarget(){
  data.targetWeight = +targetWeight.value;
  save();
}

function logDay(){
  data.logs.push({
    date: Date.now(),
    weight: +logWeight.value,
    calories: +logCalories.value
  });
  save();
}

function bmr(){
  if(!data.gender) return 0;
  return data.gender==="male"
    ? 10*w()+6.25*h()-5*a()+5
    : 10*w()+6.25*h()-5*a()-161;
}

const w=()=>last()?.weight||0;
const h=()=>data.height||0;
const a=()=>data.age||0;

function tdee(){
  return bmr()*(data.activity||1.2);
}

function targetCalories(){
  if(!data.targetWeight) return 0;
  const deficit = 0.4*7700/7;
  return Math.round(tdee()-deficit);
}

function last(){ return data.logs.at(-1); }

function trend(){
  if(data.logs.length<7) return 0;
  return (data.logs.at(-1).weight - data.logs.at(-7).weight);
}

function update(){
  if(!last()) return;

  const tc = targetCalories();
  targetCaloriesEl.innerText = tc?tc+" kcal":"—";

  const diff = last().calories - tc;
  status.innerText = diff<=0?"On track":"Over target";

  const tr = trend();
  trendEl.innerText = tr<0?"Losing":"Stagnant";

  eta.innerText = tr<0
    ? Math.abs((w()-data.targetWeight)/tr).toFixed(1)+" weeks"
    : "—";

  insightText.innerText =
    tr<0 ? "Progressing well." :
    "Plateau detected. Calories may adjust.";

  draw();
}

function draw(){
  const c = chart.getContext("2d");
  c.clearRect(0,0,chart.width,chart.height);
  if(data.logs.length<2) return;
  const weights = data.logs.map(l=>l.weight);
  const min=Math.min(...weights), max=Math.max(...weights);
  weights.forEach((v,i)=>{
    const x=i*(chart.width/(weights.length-1));
    const y=chart.height-(v-min)/(max-min)*chart.height;
    c.fillRect(x,y,4,4);
  });
}

function save(){
  localStorage.setItem("data",JSON.stringify(data));
  update();
}

update();
</script>
</body>
</html>
